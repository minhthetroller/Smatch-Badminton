name: arc_badminton
description: "Arc Badminton - Find badminton courts near you"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Mapbox
  mapbox_maps_flutter: ^2.12.0
  
  # Networking
  http: ^1.2.2
  
  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # Utilities
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
