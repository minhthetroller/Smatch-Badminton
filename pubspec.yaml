name: smatch_badminton
description: "Smatch Badminton - Match and Smash"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Mapbox
  mapbox_maps_flutter: ^2.12.0
  
  # Networking
  http: ^1.2.2
  
  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # Utilities
  url_launcher: ^6.2.5
  intl: ^0.19.0
  
  # WebSocket
  web_socket_channel: ^3.0.2
  
  # Environment variables
  envied: ^0.5.4+1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6
  
  # Social Login
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.13
  fake_async: ^1.3.2
  
  # Environment variables generator
  envied_generator: ^0.5.4+1
  
  # E2E Testing
  patrol: ^3.13.0
  patrol_finders: ^2.4.0
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/smatch_badminton_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/smatch_badminton_logo.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
